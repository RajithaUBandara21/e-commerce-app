# Deployment variant of prometheus.yml — every service in docker-compose.prod.yml
# runs on the same Docker network, so scrape targets are container hostnames
# (Docker's embedded DNS), not host.docker.internal like the local-dev version.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8222"]

  - job_name: customer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["customer-service:8091"]

  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["product-service:8050"]

  - job_name: seller-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["seller-service:8095"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8070"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8060"]

  - job_name: cart-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cart-service:8100"]

  # notification-service has no embedded web server (Kafka-consumer only,
  # no spring-boot-starter-web) — nothing to scrape, deliberately omitted.
