spring:
  application:
    name: seller-service
  config:
    import: optional:configserver:http://localhost:8888

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}

application:
  config:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

keycloak:
  admin:
    base-url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:micro}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:seller-service}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    seller-role: ${KEYCLOAK_SELLER_ROLE:seller}
